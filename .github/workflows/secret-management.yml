name: Secret Management Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify application secret
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: python secret-management/verify_secret.py
