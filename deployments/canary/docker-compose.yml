services:
  stable:
    image: nginx:alpine
    container_name: stable-app
    volumes:
      - ./stable:/usr/share/nginx/html:ro

  canary:
    image: nginx:alpine
    container_name: canary-app
    volumes:
      - ./canary:/usr/share/nginx/html:ro

  proxy:
    image: nginx:alpine
    container_name: canary-proxy
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - stable
      - canary
